# Commented commands are from template

# Official language image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/python/tags/
# image:
#     name: mvanvugt/marvel:master
#     entrypoint: [ '/bin/bash', '-c', 'ln -snf /bin/bash /bin/sh && /bin/bash -c $0' ]

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
# variables:
#   PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/topics/caching/
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
# cache:
#   paths:
#     - .cache/pip

# Run pipelines only for MRs into the default branch, tags, and the
# default branch itself (no duplicate branch + MR pipelines on dev).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - deploy

.before_script_template: &before_script_template
  before_script:
    - source resources/ci_cd/before_script.sh

test:
  <<: *before_script_template
  stage: test
  image: "python:${PYTHON_VERSION}-slim"
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
  script:
    - bash resources/ci_cd/test.sh

pages:
  <<: *before_script_template
  stage: deploy
  image: mvanvugt/log_tools:master
  script:
    - bash resources/ci_cd/pages.sh
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
